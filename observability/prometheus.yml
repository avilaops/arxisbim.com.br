global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'arxisvr-local'
    environment: 'development'

scrape_configs:
  # Scrape OTEL Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
  
  # Scrape Prometheus metrics exported by OTEL
  - job_name: 'arxisvr-backend'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'arxisvr-backend'
          component: 'api'
