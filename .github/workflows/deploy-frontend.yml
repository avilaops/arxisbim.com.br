name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install & Build
        run: |
          yarn install --frozen-lockfile
          yarn build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.arxisvr.avilaops.com
          VITE_WS_URL: wss://api.arxisvr.avilaops.com
          VITE_WS_SERVER: wss://api.arxisvr.avilaops.com
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: arxisvr-frontend@${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: "0.2"
          VITE_SENTRY_REPLAY_SESSION_RATE: "0.05"
          VITE_SENTRY_REPLAY_ERROR_RATE: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          cname: arxisvr.avilaops.com
