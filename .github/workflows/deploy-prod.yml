name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'documentation/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify before deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend (esbuild)
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (vite)
        working-directory: frontend
        run: npm run build

      - name: Install signaling-server dependencies
        working-directory: signaling-server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Verify signaling-server entrypoint loads
        working-directory: signaling-server
        run: node -e "require('./server.js')" || node -e "require('fs').accessSync('server.js')"

      - name: Smoke test — backend sobe e responde /health/live
        working-directory: backend
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-smoke-secret-not-for-prod
          HOST: 127.0.0.1
          PORT: '3001'
        run: |
          node dist/index.js &
          PID=$!
          ok=0
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null; then
              echo "✅ backend respondeu em /health/live"
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "❌ backend não respondeu a tempo"
            exit 1
          fi

  deploy:
    name: Deploy to Production Server
    needs: build
    runs-on: ubuntu-latest
    env:
      PROD_SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
      PROD_SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
      PROD_SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$PROD_SERVER_HOST" ] || [ -z "$PROD_SERVER_USER" ] || [ -z "$PROD_SERVER_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production SSH secrets are not configured; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Production SSH secrets are configured."
          fi

      - name: Deploy via SSH
        id: deploy
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.PROD_SERVER_HOST }}
          username: ${{ env.PROD_SERVER_USER }}
          key: ${{ env.PROD_SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            export ARXISVR_REPO_URL="https://github.com/${{ github.repository }}.git"
            export DEPLOY_BRANCH="${{ github.ref_name }}"
            BOOTSTRAP_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/bootstrap-deploy.sh"

            if [ -f /opt/arxisvr/scripts/bootstrap-deploy.sh ]; then
              bash /opt/arxisvr/scripts/bootstrap-deploy.sh
            elif command -v curl >/dev/null 2>&1; then
              curl -fsSL "$BOOTSTRAP_URL" | bash
            elif command -v wget >/dev/null 2>&1; then
              wget -qO- "$BOOTSTRAP_URL" | bash
            else
              echo "curl or wget is required for first-time bootstrap"
              exit 1
            fi

      - name: Deployment summary
        if: success() && steps.secrets.outputs.configured == 'true'
        run: |
          echo "✅ ArxisVR deployed successfully to production."
          echo "Server: ${{ env.PROD_SERVER_HOST }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"

      - name: Deployment failure details
        if: failure() && steps.secrets.outputs.configured == 'true'
        run: |
          echo "❌ ArxisVR production deployment failed."
          echo "Check workflow logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
