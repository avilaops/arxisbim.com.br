name: Cleanup merged branch

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-pr-head:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}"

  delete-reachable-branches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete internal branches already reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | while read -r ref; do
            branch="${ref#origin/}"
            if [ "${branch}" = "HEAD" ] || [ "${branch}" = "${DEFAULT_BRANCH}" ]; then
              continue
            fi
            if git merge-base --is-ancestor "${ref}" "origin/${DEFAULT_BRANCH}"; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
