name: CI Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  validate:
    name: Validate ArxisVR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print package versions
        run: |
          node -p "'root=' + require('./package.json').version"
          node -p "'backend=' + require('./backend/package.json').version"
          node -p "'frontend=' + require('./frontend/package.json').version"

      - name: Validate app HTML assets
        run: |
          test -f frontend/app.html
          test -f frontend/index.html
          test -f frontend/login.html
          test -f frontend/register.html
          test -f frontend/public/logo-icon.svg
          test -f frontend/src/app/bootstrap.ts
          test -f frontend/src/app/entrypoints/login-main.tsx
          test -f frontend/src/app/entrypoints/register-main.tsx

      - name: Validate Vite config
        run: |
          test -f frontend/vite.config.ts
          grep -q "defineConfig" frontend/vite.config.ts
          grep -q "app.html" frontend/vite.config.ts
