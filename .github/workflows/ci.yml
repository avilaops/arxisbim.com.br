name: CI

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**', 'ci/**', 'claude/**']
  pull_request:
    branches: [main]

# Push seguido de push na mesma branch: o run antigo não interessa mais.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portao do frontend: lint (sem erros), type-check, testes e build. Lint e
  # testes eram informativos enquanto a main estava vermelha neles; ficaram
  # verdes (0 erros de lint, 77 de 77 arquivos de teste) e viraram portao em
  # 12/10/2026. Os avisos de lint continuam so a vista: a maioria esta nos
  # arquivos orfaos (documentation/AUDIT-2026-09-02-sprints-e-codigo-morto.md).
  frontend:
    name: Frontend — lint, type-check, testes e build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm, nao yarn: o frontend tem package-lock.json e nenhum yarn.lock, e o
      # package.json da raiz declara "packageManager": "npm@11.16.0" — o yarn 1
      # do runner le esse campo como "yarn@npm@11.16.0" e recusa instalar. Era
      # o que deixava TODO PR vermelho neste passo, antes de qualquer teste
      # rodar (e o que fazia `yarn lint` morrer com "eslint: not found").
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend (vitest)
        working-directory: frontend
        run: npm test

      - name: Build frontend (vite)
        working-directory: frontend
        run: npm run build

      # O build fica disponivel por alguns dias para conferir as telas num
      # navegador antes de publicar, sem compilar em servidor nenhum.
      - name: Guardar o build do frontend
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  backend:
    name: Backend — type-check, migrations, testes e smoke
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    services:
      postgres:
        image: postgres:18.6
        env:
          # As credenciais espelham o default de `backend/vitest.config.ts`
          # (postgres/postgres/arxisvr_test). O job do repo antigo subia o
          # servico como ci/ci e nao passava TEST_DATABASE_URL: os 67 arquivos
          # morriam em "password authentication failed for user postgres"
          # antes de qualquer teste rodar. Mesmo assim o passo abaixo declara
          # TEST_DATABASE_URL, para a origem da URL ser explicita.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arxisvr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

      # Sem isto os testes sobem num banco vazio e 35 arquivos quebram em
      # `relation "tenants" does not exist`. A ordem e a mesma do
      # `scripts/verify-migrations.mjs`: nome de arquivo, em ordem alfabetica.
      - name: Apply migrations to the test database
        working-directory: backend
        env:
          PGPASSWORD: postgres
        run: |
          for arquivo in $(ls migrations/*.sql | sort); do
            echo "→ $arquivo"
            psql -h 127.0.0.1 -U postgres -d arxisvr_test -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done
          psql -h 127.0.0.1 -U postgres -d arxisvr_test -c \
            "select count(*) as tabelas from information_schema.tables where table_schema='public'"

      - name: Test backend (vitest)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/arxisvr_test
        run: npm test

      - name: Build backend (esbuild)
        working-directory: backend
        run: npm run build

      - name: Smoke test — backend sobe e responde /health/live
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/arxisvr_test
          JWT_SECRET: ci-smoke-secret-not-for-prod
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod
          HOST: 127.0.0.1
          PORT: '3001'
          NODE_ENV: test
        run: |
          timeout 60s node --import ./dist/instrument.js dist/index.js > backend.log 2>&1 &
          PID=$!
          echo "Backend started with PID $PID"
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null 2>&1; then
              echo "✅ backend respondeu em /health/live após ${i} tentativas ($(($i * 2)) segundos)"
              ok=1
              break
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ backend crashou! Logs:"
              cat backend.log
              exit 1
            fi
            echo "Tentativa $i/40: backend ainda não respondeu..."
            sleep 2
          done
          echo "=== Backend logs ==="
          cat backend.log 2>/dev/null || echo "No logs available"
          echo "==================="
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "❌ backend não respondeu a tempo (80 segundos)"
            exit 1
          fi

  signaling:
    name: Signaling server — sanity check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Dev local (porta 3002). Em producao o WebSocket e servido pelo proprio
      # backend, entao aqui basta provar que o arquivo ainda carrega.
      - name: Install signaling-server dependencies
        working-directory: signaling-server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sanity check signaling-server entrypoint
        working-directory: signaling-server
        run: node --check server.js
