name: CI

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend (esbuild)
        working-directory: backend
        run: npm run build

      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (vite)
        working-directory: frontend
        run: npm run build

      - name: Install signaling-server dependencies
        working-directory: signaling-server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Sanity check signaling-server entrypoint
        working-directory: signaling-server
        run: node --check server.js

      - name: Smoke test — backend sobe e responde /health/live
        working-directory: backend
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-smoke-secret-not-for-prod
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod
          HOST: 127.0.0.1
          PORT: '3001'
          NODE_ENV: test
        run: |
          timeout 60s node dist/index.js > backend.log 2>&1 &
          PID=$!
          echo "Backend started with PID $PID"
          ok=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null 2>&1; then
              echo "✅ backend respondeu em /health/live após ${i} tentativas ($(($i * 2)) segundos)"
              ok=1
              break
            fi
            if ! kill -0 $PID 2>/dev/null; then
              echo "❌ backend crashou! Logs:"
              cat backend.log
              exit 1
            fi
            echo "Tentativa $i/40: backend ainda não respondeu..."
            sleep 2
          done
          echo "=== Backend logs ==="
          cat backend.log 2>/dev/null || echo "No logs available"
          echo "==================="
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "❌ backend não respondeu a tempo (80 segundos)"
            exit 1
          fi
