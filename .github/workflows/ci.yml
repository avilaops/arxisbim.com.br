name: CI

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build backend (esbuild)
        working-directory: backend
        run: pnpm run build

      - name: Type-check backend (não bloqueia o deploy)
        working-directory: backend
        run: pnpm run type-check
        continue-on-error: true

      - name: Build frontend (vite)
        working-directory: frontend
        run: pnpm run build

      - name: Smoke test — backend sobe e responde /health/live
        working-directory: backend
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-smoke-secret-not-for-prod
          HOST: 127.0.0.1
          PORT: '3001'
        run: |
          node dist/index.js &
          PID=$!
          ok=0
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null; then
              echo "✅ backend respondeu em /health/live"
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "❌ backend não respondeu a tempo"
            exit 1
          fi
