<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar na sessão — ArxisVR</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .logo { font-size: 22px; font-weight: 700; color: #60a5fa; letter-spacing: -0.5px; }
    .logo span { color: #e2e8f0; }
    h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; }
    .meta { font-size: 13px; color: #94a3b8; display: flex; flex-direction: column; gap: 6px; }
    .meta strong { color: #e2e8f0; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #3b82f6; }
    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #0f172a;
      color: #94a3b8;
      display: none;
    }
    .status.error { background: #450a0a; color: #fca5a5; display: block; }
    .status.loading { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Arxis<span>VR</span></div>
    <div id="content">
      <div class="status loading" id="loading-msg">Carregando sessão...</div>
    </div>
  </div>
  <script type="module" src="/src/app/entrypoints/join-main.ts"></script>
</body>
</html>
