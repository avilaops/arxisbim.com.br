<!-- Exemplo de HTML para integração com Viewer 3D -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Viewer 3D - Upload Demo</title>
  <!-- DM Sans Font (Luma style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Palette: Lu.ma Premium Light System */
      --bg-app: linear-gradient(135deg, #F5F5F7 0%, #EDE9FF 35%, #E3F0FF 75%, #F5F5F7 100%);
      --bg-card: rgba(255, 255, 255, 0.82);
      --border-color: rgba(0, 0, 0, 0.06);
      --text-primary: #1A1A1A;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      padding: 40px 20px;
      letter-spacing: -0.1px;
    }

    #canvas3d { 
      width: 80vw; 
      height: 60vh; 
      border: 1px solid var(--border-color); 
      border-radius: 22px;
      display: block; 
      margin: 2rem auto; 
      background: var(--bg-card);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.05);
    }
    
    #file-input { 
      display: block; 
      margin: 1rem auto; 
      padding: 12px 24px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #file-input:hover {
      border-color: rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body>
  <input type="file" id="file-input" accept=".glb,.ifc" />
  <div id="canvas3d"></div>
  <script type="module" src="./src/viewer/example-viewer3d-upload.ts"></script>
</body>
</html>
