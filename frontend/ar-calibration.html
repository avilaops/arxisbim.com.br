<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ArxisVR - Calibração AR</title>
  <!-- DM Sans Font (Luma style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.341.0/font/lucide.min.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Palette: Lu.ma Premium Light System */
      --bg-app: linear-gradient(135deg, #F5F5F7 0%, #EDE9FF 35%, #E3F0FF 75%, #F5F5F7 100%);
      --bg-panel: rgba(255, 255, 255, 0.78);
      --bg-panel-solid: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.82);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
      --text-muted: #AEAEB2;
      
      --border-color: rgba(0, 0, 0, 0.06);
      --border-hover: rgba(0, 0, 0, 0.12);
      
      --accent-blue: #007AFF;
      --accent-purple: #C4B5F4;
      --accent-purple-light: #EDE9FF;
      --accent-green: #34C759;
      --accent-red: #FF3B30;
      --accent-yellow: #FF9500;
      
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 12px 36px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.08);
      
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      letter-spacing: -0.1px;
    }

    /* Force Lucide icons to have ultra-thin, elegant strokes (Lu.ma style) */
    .lucide {
      stroke-width: 1.4px !important;
      width: 18px;
      height: 18px;
      display: inline-block;
      vertical-align: middle;
    }

    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #camera-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .ui-panel {
      pointer-events: auto;
      background: var(--bg-panel);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow-md);
    }

    #top-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
    }

    #project-info {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    #marker-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .marker-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-purple-light);
      border: 1px solid var(--accent-purple);
      border-radius: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .marker-details h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #000000;
      letter-spacing: -0.3px;
    }

    .marker-details p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    #status-panel {
      position: absolute;
      bottom: 140px;
      left: 20px;
      right: 20px;
    }

    #status-message {
      font-size: 14px;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    #progress-bar {
      height: 4px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    #progress-fill {
      height: 100%;
      background: #000000;
      width: 0%;
      transition: width 0.3s ease;
    }

    #metrics {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .metric {
      flex: 1;
      text-align: center;
    }

    .metric-value {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 2px;
    }

    .metric-label {
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    #controls-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
    }

    .button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 12px;
      font-family: inherit;
    }

    .button:active {
      transform: scale(0.97);
    }

    .button-primary {
      background: #000000;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    .button-primary:hover {
      background: #222222;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }

    .button-secondary {
      background: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .button-secondary:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 0, 0, 0.15);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #help-button {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: #000000;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
    }

    #help-button:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 0, 0, 0.15);
      transform: scale(1.05);
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #000000;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      top: 50%;
      left: 0;
      height: 2px;
      width: 100%;
      transform: translateY(-50%);
    }

    .phase-searching #status-message { color: var(--accent-yellow); }
    .phase-detecting #status-message { color: var(--accent-blue); }
    .phase-tracking #status-message { color: var(--accent-green); }
    .phase-stabilizing #status-message { color: var(--accent-green); }
    .phase-completed #status-message { color: var(--accent-green); }

    #success-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 20px;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }

    #success-overlay.show {
      display: flex;
    }

    .success-icon {
      font-size: 80px;
      color: var(--accent-green);
    }

    .success-message {
      font-size: 24px;
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.5px;
    }

    #error-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 20px;
      padding: 40px;
      text-align: center;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }

    #error-overlay.show {
      display: flex;
    }

    .error-icon {
      font-size: 80px;
      color: var(--accent-red);
    }

    .error-message {
      font-size: 24px;
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.5px;
    }

    .error-details {
      font-size: 14px;
      color: var(--text-secondary);
    }
  </style>
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-CWIbYaaI.js"></script>
<link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
<body>
  <!-- Video Container -->
  <div id="video-container">
    <video id="camera-feed" playsinline autoplay></video>
    <canvas id="canvas-overlay"></canvas>
    <div id="crosshair"></div>
  </div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- Top Panel -->
    <div id="top-panel" class="ui-panel">
      <div id="project-info">Projeto: <span id="project-name">Carregando...</span></div>
      <div id="marker-info">
        <div class="marker-icon">📍</div>
        <div class="marker-details">
          <h2 id="marker-name">Marker não selecionado</h2>
          <p id="marker-type">Tipo: -</p>
        </div>
      </div>
    </div>

    <!-- Help Button -->
    <button id="help-button" title="Ajuda">?</button>

    <!-- Status Panel -->
    <div id="status-panel" class="ui-panel">
      <div id="status-message">Aponte a câmera para o marker</div>
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
      <div id="metrics">
        <div class="metric">
          <span class="metric-value" id="confidence-value">0%</span>
          <span class="metric-label">Confiança</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="frames-value">0</span>
          <span class="metric-label">Frames</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="stability-value">0%</span>
          <span class="metric-label">Estabilidade</span>
        </div>
      </div>
    </div>

    <!-- Controls Panel -->
    <div id="controls-panel" class="ui-panel">
      <button id="start-button" class="button button-primary">Iniciar Calibração</button>
      <button id="cancel-button" class="button button-secondary" disabled>Cancelar</button>
    </div>
  </div>

  <!-- Success Overlay -->
  <div id="success-overlay">
    <div class="success-icon">✓</div>
    <div class="success-message">Calibração Concluída!</div>
    <button class="button button-secondary" onclick="window.close()">Fechar</button>
  </div>

  <!-- Error Overlay -->
  <div id="error-overlay">
    <div class="error-icon">⚠</div>
    <div class="error-message">Erro na Calibração</div>
    <div class="error-details" id="error-details"></div>
    <button class="button button-secondary" onclick="location.reload()">Tentar Novamente</button>
  </div>

</body>
</html>
