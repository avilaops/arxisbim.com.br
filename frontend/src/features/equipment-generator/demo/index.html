<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerador 3D · demo</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --ink: #141413;
        --muted: #6d6a63;
        --line: #e2dfd8;
        --surface: #fff;
        --accent: #96764a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 Barlow,
          Inter,
          Arial,
          sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.01em;
      }
      .lead {
        color: var(--muted);
        margin-top: 4px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        margin-top: 20px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .code {
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      .card h2 {
        font-size: 22px;
        line-height: 1.1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      td {
        padding: 5px 0;
        border-bottom: 1px solid var(--line);
      }
      td:last-child {
        text-align: right;
      }
      .ok {
        color: #2f7d4a;
      }
      .bad {
        color: #b8242a;
      }
      .plan svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .dl {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dl button {
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--ink);
        background: none;
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .warn {
        font-size: 12px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gerador 3D paramétrico · Fase 1</h1>
      <p class="lead">
        Modelos gerados a partir do spec (dimensões + família + parâmetros). Nenhum arquivo de
        modelo externo.
      </p>
      <div class="grid" id="grid"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
