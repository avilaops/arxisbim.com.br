<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arxis - Redirecionando...</title>
  <!-- DM Sans Font (Luma style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Palette: Lu.ma Premium Light System */
      --bg-app: linear-gradient(135deg, #F5F5F7 0%, #EDE9FF 35%, #E3F0FF 75%, #F5F5F7 100%);
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      letter-spacing: -0.1px;
    }

    p {
      font-size: 16px;
      color: var(--text-secondary);
      font-weight: 500;
    }
  </style>
  <script>
    // GitHub Pages SPA fallback
    // Redireciona 404 para index.html preservando a rota
    (function() {
      const path = window.location.pathname;
      const base = '/';
      
      if (path !== base) {
        const redirect = base + '?' + 'path=' + encodeURIComponent(path);
        window.location.replace(redirect);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecionando...</p>
</body>
</html>
