<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">

  <!-- Background -->
  <rect width="500" height="500" fill="#0D1117"/>

  <!-- "A" mark — two legs, stroke-based, precision architectural feel -->
  <!-- Left leg -->
  <line x1="175" y1="320" x2="250" y2="148"
    stroke="#FFFFFF" stroke-width="22" stroke-linecap="square"/>
  <!-- Right leg -->
  <line x1="325" y1="320" x2="250" y2="148"
    stroke="#FFFFFF" stroke-width="22" stroke-linecap="square"/>

  <!-- Crossbar — the AXIS, in electric blue -->
  <line x1="204" y1="258" x2="296" y2="258"
    stroke="#3B82F6" stroke-width="18" stroke-linecap="square"/>

  <!-- Axis extension — subtle horizontal lines beyond the legs, suggesting measurement/precision -->
  <line x1="155" y1="258" x2="195" y2="258"
    stroke="#3B82F6" stroke-width="3" stroke-linecap="square" opacity="0.4"/>
  <line x1="305" y1="258" x2="345" y2="258"
    stroke="#3B82F6" stroke-width="3" stroke-linecap="square" opacity="0.4"/>

  <!-- Small apex dot — the highest point, the "arx" -->
  <rect x="240" y="140" width="20" height="20" fill="#3B82F6"/>

  <!-- Wordmark -->
  <text x="250" y="390"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800" font-size="52" letter-spacing="10"
    fill="#FFFFFF" text-anchor="middle">ARXIS</text>

  <!-- VR label — small, subordinate -->
  <text x="250" y="420"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400" font-size="13" letter-spacing="5"
    fill="#3B82F6" text-anchor="middle" opacity="0.8">VR PLATFORM</text>

</svg>
