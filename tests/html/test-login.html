<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArxisVR Multi-tenant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            font-weight: 700;
        }

        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .tenant-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .tenant-info strong {
            color: #333;
        }

        .demo-accounts {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
        }

        .demo-accounts h4 {
            color: #856404;
            margin-bottom: 10px;
        }

        .demo-accounts ul {
            list-style: none;
            padding-left: 0;
        }

        .demo-accounts li {
            color: #856404;
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏗️ ArxisVR</h1>
            <p>Sistema Multi-tenant de Visualização BIM</p>
        </div>

        <div class="tenant-info">
            <strong>🔐 Multi-tenancy Real Implementado!</strong><br>
            Mesmo email pode existir em tenants diferentes.<br>
            Selecione o tenant para fazer login.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="tenantId">Tenant (Empresa)</label>
                <select id="tenantId" name="tenantId" required>
                    <option value="">Selecione um tenant...</option>
                    <option value="demo-construtora-xyz">Construtora XYZ</option>
                    <option value="demo-arquitetura-abc">Arquitetura ABC</option>
                    <option value="demo-cliente-sa">Cliente SA</option>
                    <option value="default">Default Tenant</option>
                    <option value="avilaops">AvilaOps</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Entrar
            </button>
        </form>

        <div id="message" class="message"></div>

        <div class="demo-accounts">
            <h4>📋 Conta de Demonstração</h4>
            <ul>
                <li>Email: <strong>eduardo@empresa.com</strong></li>
                <li>Senha: <strong>senha123</strong></li>
                <li>Disponível em 3 tenants diferentes!</li>
            </ul>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/v1';
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const message = document.getElementById('message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const tenantId = document.getElementById('tenantId').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';
            showMessage('Verificando credenciais...', 'success');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        tenantId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(`✅ Login bem-sucedido!<br>
                        Tenant: ${tenantId}<br>
                        Email: ${email}<br>
                        Token: ${data.token ? data.token.substring(0, 20) + '...' : 'Gerado'}`, 
                        'success'
                    );

                    // Salvar no localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('tenantId', tenantId);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    console.log('✅ Login Response:', data);
                } else {
                    showMessage(`❌ Erro: ${data.message || 'Credenciais inválidas'}`, 'error');
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                showMessage(`❌ Erro de conexão: ${error.message}<br>
                    Verifique se o backend está rodando em ${API_URL}`, 
                    'error'
                );
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        });

        function showMessage(text, type) {
            message.innerHTML = text;
            message.className = `message ${type}`;
        }

        // Auto-preencher com dados de demonstração
        document.getElementById('email').value = 'eduardo@empresa.com';
        document.getElementById('password').value = 'senha123';
        document.getElementById('tenantId').value = 'demo-construtora-xyz';
    </script>
</body>
</html>
