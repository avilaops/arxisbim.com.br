# =====================================================================
# Render Blueprint — ArxisVR
# Config versionada do deploy. Com isto o Render para de depender de
# ajustes manuais no dashboard: build e start ficam determinísticos.
# Docs: https://render.com/docs/blueprint-spec
# =====================================================================
services:
  # -------------------------------------------------------------------
  # Web service principal: backend Fastify que TAMBÉM serve o frontend
  # buildado (frontend/dist via @fastify/static). Por isso o build
  # compila os dois; o start roda só o backend.
  # -------------------------------------------------------------------
  - type: web
    name: arxisvr
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health/live
    # --include=dev é obrigatório: vite (frontend) e tsx vivem em
    # devDependencies; sem isso o build quebra quando NODE_ENV=production.
    # Frontend agora é servido pelo Cloudflare Pages — build somente do backend
    buildCommand: cd backend && npm ci --include=dev && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # PORT é injetado automaticamente pelo Render — NÃO definir aqui.
      # Segredos: marcados sync:false => você preenche no dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # VITE_* removidas — frontend agora é buildado pelo Cloudflare Pages
      # URLs do próprio serviço — usadas para construir redirect URIs do OAuth
      - key: BACKEND_URL
        value: https://api.arxisvr.avilaops.com
      - key: FRONTEND_URL
        value: https://www.arxisvr.avilaops.com
      # Storage durável: Render free NÃO tem disco persistente, o driver local
      # cai em /tmp (efêmero) e os IFCs somem a cada restart/deploy. Cloudflare
      # R2 (S3-compatível) resolve. Segredos = sync:false (preencher no dashboard).
      - key: STORAGE_DRIVER
        value: r2
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # OAuth Google — preencher no dashboard (sync:false = segredo)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # OAuth GitHub — preencher no dashboard (sync:false = segredo)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # -------------------------------------------------------------------
  # NÃO há serviço de signaling separado em produção. O WebSocket
  # (signaling/realtime: rooms, avatar_update, chat) é servido pelo
  # próprio backend `arxisvr` em wss://api.arxisvr.avilaops.com.
  # O diretório signaling-server/ é apenas para dev local (porta 3002).
  # -------------------------------------------------------------------
