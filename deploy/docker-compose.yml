# ArxisVR no servidor orquestrador (infra, 23.88.60.193 / 10.10.0.1).
#
# Vive em /opt/arxisvr. Depois da saída do Docker, só o Caddy que serve o build
# estático do frontend continua em container. O resto roda nativo no host:
#
#   - PostgreSQL 18.6  → serviço systemd, 127.0.0.1:5432
#   - API + signaling  → PM2 (ver ecosystem.config.js)
#
# ATENÇÃO: o Caddy que termina TLS é o do stack /opt/observabilidade e ele fazia
# `reverse_proxy api:3001` pelo nome do serviço docker. Esse nome deixou de
# existir. Aquele Caddyfile precisa apontar para o host (10.10.0.1:3001) ANTES
# de derrubar o container antigo, senão a API sai do ar.
#
# Os volumes `db-data` e `uploads` foram removidos daqui de propósito, mas NÃO
# são apagados por isso: continuam no docker até alguém removê-los à mão. Só
# remova depois de confirmar que os dados foram migrados para o host.

services:
  web:
    image: caddy:2-alpine
    container_name: arxisvr-web
    restart: unless-stopped
    volumes:
      # O build sai da máquina do dev (213 mil linhas não cabem confortavelmente
      # em 3,7 GB de RAM); aqui só entra o `dist` pronto, montado como leitura.
      - ./web/dist:/srv:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - web-data:/data
      - web-config:/config

volumes:
  web-data:
  web-config:

networks:
  default:
    name: arxisvr_default
