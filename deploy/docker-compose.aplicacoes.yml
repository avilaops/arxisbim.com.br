# ArxisVR no servidor apps-noclient (204.168.249.111). Ate 10/09/2026, no de aplicacoes (178.105.82.48).
#
# Diferente do compose antigo (deploy/docker-compose.yml, escrito para o
# orquestrador), porque a maquina e outra e as restricoes tambem:
#
#   - Nao ha container de banco. Desde 14/11/2026 o banco `arxisvr` fica no
#     PostgreSQL 18 do servidor applications, em 10.10.0.2:5432 via WireGuard.
#     DATABASE_URL no .env do servidor usa o usuario arxisvr_service. A copia
#     antiga no PostgreSQL local foi preservada para recuperacao e deixou de
#     ser usada pela API. Ver documentation/REATIVACAO-2026-11-14.md.
#
#   - As portas SAO publicadas em 127.0.0.1. Aqui o Caddy roda nativo no host
#     (nao em container), entao ele nao alcanca a rede docker por nome de
#     servico: alcanca por porta local. Ficam fechadas para fora pelo firewall,
#     porque o bind e 127.0.0.1 e nao 0.0.0.0.
#
#   - `host.docker.internal` continua disponivel para integracoes locais.
#     A conexao de banco do Arxis usa o endereco privado de applications.
#
#   - A sub-rede e FIXA em 172.23.0.0/16, e isso nao e detalhe. O firewall
#     libera a 5432 so para 172.16.0.0/12; se o Docker escolher a faixa
#     sozinho, ele pega 192.168.x e a conexao com o Postgres morre em
#     CONNECT_TIMEOUT, que foi o que aconteceu na primeira subida.
#     A /24 dentro de 172.16 e de proposito: os /16 de 172.17 a 172.30 ja estao
#     todos tomados por outros projetos desta maquina, e 172.16.0.0/24 (a
#     rede `edge`) deixa o resto do /16 livre.
#
# RAM e o recurso escasso aqui: 35 containers, ~770 MB livres e swap em uso.
# Por isso a imagem da API e construida na maquina do Nicolas e enviada pronta
# (docker save | ssh docker load), em vez de compilar no servidor.

services:
  api:
    image: arxisvr-api:local
    container_name: arxisvr-api
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3101:3001"
    volumes:
      # Driver de storage local. Sem este volume os IFCs enviados somem no
      # primeiro deploy.
      - uploads:/app/uploads

  web:
    image: caddy:2-alpine
    container_name: arxisvr-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:80"
    volumes:
      - ./web/dist:/srv:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - web-data:/data
      - web-config:/config

volumes:
  uploads:
  web-data:
  web-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.16.50.0/24
